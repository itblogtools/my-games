<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>안전한 비밀번호 생성기 &amp; 강도 체크</title>
<style>
  :root{
    --bg:#0d1117; --panel:#151b23; --line:#2b3440; --text:#e6edf3; --sub:#7d8590;
    --accent:#39ff88; --accent-dim:#1e7a4c; --bad:#ff5c5c; --amber:#ffb454; --dark:#04140b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'JetBrains Mono','Courier New',monospace;}
  body{display:flex;justify-content:center;padding:16px;}
  .wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px;}

  .titlebar{display:flex;align-items:baseline;gap:8px;color:var(--sub);font-size:12px;}
  .titlebar .prompt{color:var(--accent);}
  h1{font-size:18px;font-weight:700;margin:2px 0 4px;color:var(--text);}
  .desc{color:var(--sub);font-size:12px;line-height:1.6;margin:0 0 6px;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;}

  .pwdisplay{
    background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:16px;font-size:20px;font-weight:700;letter-spacing:0.02em;
    word-break:break-all;color:var(--accent);min-height:32px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .pwdisplay span{flex:1;}
  .copybtn{
    background:var(--panel);border:1px solid var(--line);color:var(--sub);
    border-radius:6px;padding:8px 10px;font-size:11px;font-family:inherit;cursor:pointer;
    white-space:nowrap;
  }
  .copybtn:active{transform:scale(0.95);}
  .copybtn.copied{color:var(--accent);border-color:var(--accent);}

  .strength-row{margin-top:14px;}
  .strength-label{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:6px;}
  .strength-track{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--line);}
  .strength-fill{height:100%;border-radius:6px;transition:width .2s ease, background .2s ease;}

  label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;margin-top:16px;}
  label:first-of-type{margin-top:0;}

  .rangerow{display:flex;align-items:center;gap:12px;}
  input[type=range]{flex:1;accent-color:var(--accent);}
  .rangeval{color:var(--accent);font-weight:700;font-size:14px;min-width:30px;text-align:right;}

  .checkrow{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--text);}
  input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);}

  button.primary{
    width:100%;margin-top:18px;background:var(--accent);color:var(--dark);border:none;border-radius:8px;
    padding:14px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;
  }
  button.primary:active{transform:scale(0.98);}

  .divider{border-top:1px dashed var(--line);margin:20px 0;}

  .checkinput{
    width:100%;padding:12px;font-size:15px;background:var(--bg);color:var(--text);
    border:1px solid var(--line);border-radius:8px;font-family:inherit;
  }

  .criteria{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
  .crit{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);}
  .crit .dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
  .crit.ok{color:var(--text);}
  .crit.ok .dot{background:var(--accent);}

  .disclaimer{font-size:11px;color:var(--sub);line-height:1.6;border-top:1px dashed var(--line);padding-top:12px;margin-top:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="titlebar"><span class="prompt">$</span> password-tool --run</div>
  <h1>안전한 비밀번호 생성기 &amp; 강도 체크</h1>
  <p class="desc">조건을 설정해서 안전한 비밀번호를 생성하거나, 기존에 쓰던 비밀번호가 얼마나 안전한지 확인해보세요.</p>

  <div class="panel">
    <div class="pwdisplay"><span id="pwOut">P@ssw0rd!2026</span><button class="copybtn" id="copyBtn">복사</button></div>

    <div class="strength-row">
      <div class="strength-label"><span id="genStrengthLabel">강도: 보통</span></div>
      <div class="strength-track"><div class="strength-fill" id="genStrengthFill"></div></div>
    </div>

    <label>길이</label>
    <div class="rangerow">
      <input type="range" id="lenRange" min="6" max="32" value="14">
      <div class="rangeval" id="lenVal">14</div>
    </div>

    <div class="checkrow"><input type="checkbox" id="optUpper" checked><label style="margin:0;">대문자 포함 (A-Z)</label></div>
    <div class="checkrow"><input type="checkbox" id="optLower" checked><label style="margin:0;">소문자 포함 (a-z)</label></div>
    <div class="checkrow"><input type="checkbox" id="optNumber" checked><label style="margin:0;">숫자 포함 (0-9)</label></div>
    <div class="checkrow"><input type="checkbox" id="optSymbol" checked><label style="margin:0;">특수문자 포함 (!@#$...)</label></div>

    <button class="primary" id="genBtn">새 비밀번호 생성</button>
  </div>

  <div class="divider"></div>

  <div class="panel">
    <label>기존 비밀번호 강도 확인 (입력값은 저장/전송되지 않습니다)</label>
    <input type="text" id="checkInput" class="checkinput" placeholder="비밀번호를 입력해보세요">

    <div class="strength-row">
      <div class="strength-label"><span id="checkStrengthLabel">강도: -</span></div>
      <div class="strength-track"><div class="strength-fill" id="checkStrengthFill"></div></div>
    </div>

    <div class="criteria" id="criteriaList"></div>
  </div>

  <div class="disclaimer">
    ※ 이 도구는 브라우저 안에서만 동작하며, 입력하신 비밀번호는 서버로 전송되거나 저장되지 않습니다. 다만 여러 사이트에서 동일한 비밀번호를 재사용하지 않는 것이 가장 중요한 보안 습관입니다.
  </div>
</div>

<script>
(function(){
  var UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  var LOWER = 'abcdefghijklmnopqrstuvwxyz';
  var NUMBER = '0123456789';
  var SYMBOL = '!@#$%^&*()_+-=[]{}|;:,.<>?';

  var pwOut = document.getElementById('pwOut');
  var lenRange = document.getElementById('lenRange');
  var lenVal = document.getElementById('lenVal');
  var genBtn = document.getElementById('genBtn');
  var copyBtn = document.getElementById('copyBtn');

  function randChar(str){ return str[Math.floor(Math.random() * str.length)]; }

  function generatePassword(){
    var len = parseInt(lenRange.value, 10);
    var pools = [];
    if (document.getElementById('optUpper').checked) pools.push(UPPER);
    if (document.getElementById('optLower').checked) pools.push(LOWER);
    if (document.getElementById('optNumber').checked) pools.push(NUMBER);
    if (document.getElementById('optSymbol').checked) pools.push(SYMBOL);

    if (pools.length === 0){
      pwOut.textContent = '옵션을 최소 1개 선택하세요';
      return;
    }
    var all = pools.join('');
    var pwChars = [];
    // 보장: 선택된 각 종류에서 최소 1글자씩
    pools.forEach(function(p){ pwChars.push(randChar(p)); });
    while (pwChars.length < len){
      pwChars.push(randChar(all));
    }
    // 셔플
    for (var i = pwChars.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = pwChars[i]; pwChars[i] = pwChars[j]; pwChars[j] = t;
    }
    var pw = pwChars.slice(0, len).join('');
    pwOut.textContent = pw;
    updateStrength(pw, document.getElementById('genStrengthLabel'), document.getElementById('genStrengthFill'));
  }

  function scorePassword(pw){
    var score = 0;
    if (pw.length >= 8) score++;
    if (pw.length >= 12) score++;
    if (pw.length >= 16) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[a-z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    return score; // 0~7
  }

  function updateStrength(pw, labelEl, fillEl){
    var score = scorePassword(pw);
    var pct = Math.min(100, Math.round((score / 7) * 100));
    var text, color;
    if (score <= 2){ text = '약함'; color = 'var(--bad)'; }
    else if (score <= 4){ text = '보통'; color = 'var(--amber)'; }
    else { text = '강함'; color = 'var(--accent)'; }
    labelEl.textContent = '강도: ' + text;
    fillEl.style.width = pct + '%';
    fillEl.style.background = color;
  }

  lenRange.addEventListener('input', function(){
    lenVal.textContent = lenRange.value;
  });
  genBtn.addEventListener('click', generatePassword);

  copyBtn.addEventListener('click', function(){
    var text = pwOut.textContent;
    if (navigator.clipboard){
      navigator.clipboard.writeText(text).then(function(){
        copyBtn.textContent = '복사됨!';
        copyBtn.classList.add('copied');
        setTimeout(function(){ copyBtn.textContent = '복사'; copyBtn.classList.remove('copied'); }, 1500);
      });
    }
  });

  // ---------- 기존 비밀번호 체크 ----------
  var checkInput = document.getElementById('checkInput');
  var checkLabel = document.getElementById('checkStrengthLabel');
  var checkFill = document.getElementById('checkStrengthFill');
  var criteriaList = document.getElementById('criteriaList');

  var CRITERIA = [
    { key:'len8', label:'8자 이상', test:function(pw){ return pw.length >= 8; } },
    { key:'len12', label:'12자 이상 (권장)', test:function(pw){ return pw.length >= 12; } },
    { key:'upper', label:'대문자 포함', test:function(pw){ return /[A-Z]/.test(pw); } },
    { key:'lower', label:'소문자 포함', test:function(pw){ return /[a-z]/.test(pw); } },
    { key:'number', label:'숫자 포함', test:function(pw){ return /[0-9]/.test(pw); } },
    { key:'symbol', label:'특수문자 포함', test:function(pw){ return /[^A-Za-z0-9]/.test(pw); } }
  ];

  function renderCriteria(pw){
    criteriaList.innerHTML = '';
    CRITERIA.forEach(function(c){
      var ok = pw.length > 0 && c.test(pw);
      var row = document.createElement('div');
      row.className = 'crit' + (ok ? ' ok' : '');
      row.innerHTML = '<div class="dot"></div><span>' + c.label + '</span>';
      criteriaList.appendChild(row);
    });
  }

  checkInput.addEventListener('input', function(){
    var pw = checkInput.value;
    if (pw.length === 0){
      checkLabel.textContent = '강도: -';
      checkFill.style.width = '0%';
      criteriaList.innerHTML = '';
      return;
    }
    updateStrength(pw, checkLabel, checkFill);
    renderCriteria(pw);
  });

  // initial
  generatePassword();
})();
</script>
</body>
</html>
